plugins {
    id 'com.android.application'
}

android {
    namespace 'com.offread.app'
    compileSdk 33

    defaultConfig {
        applicationId "com.offread.app"
        minSdk 24
        targetSdk 33
        versionCode 2
        versionName "1.0.0-rot1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 100% native Android framework APIs for maximum performance,
    // zero bloat, instant startup, and complete offline privacy.
}
